name: Weekly update

# Wednesday: grade last week, post next week's projections, check injuries.
# Friday and Sunday: refresh the injury report only (projections stay locked).
on:
  schedule:
    - cron: "0 13 * * 3"    # Wed 13:00 UTC (8 AM Central): full update
    - cron: "0 13 * * 4"    # Thu 13:00 UTC: full update again, in case Wednesday's stats were late
    - cron: "0 21 * * 5"    # Fri 21:00 UTC (4 PM Central): injuries only
    - cron: "30 15 * * 0"   # Sun 15:30 UTC (10:30 AM Central): injuries only
  workflow_dispatch:        # run by hand from the Actions tab (full update)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Full update (grade, project, injuries)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 13 * * 3' || github.event.schedule == '0 13 * * 4'
        run: python pipeline/update.py --season 2026

      - name: Injury report only
        if: github.event_name == 'schedule' && github.event.schedule != '0 13 * * 3' && github.event.schedule != '0 13 * * 4'
        run: python pipeline/update.py --season 2026 --injuries-only

      - name: Commit updated data
        run: |
          git config user.name "weekly-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
