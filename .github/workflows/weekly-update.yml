name: Weekly update

# Every Wednesday morning: grade last week's projections and post the next week's.
# nflverse usually publishes the previous week's stats by Tuesday.
on:
  schedule:
    - cron: "0 13 * * 3"   # Wednesdays 13:00 UTC (8 AM Central during daylight time)
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Grade last week and project the next
        run: python pipeline/update.py --season 2026

      - name: Commit updated data
        run: |
          git config user.name "weekly-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly update: $(date -u +'%Y-%m-%d')"
            git push
          fi
